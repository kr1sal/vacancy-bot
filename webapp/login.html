<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<title>Chert Vacancy Bot — вход</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #f4f4f5;
    --text: #1a1a1e;
    --muted: #8a8a92;
    --accent: #7c40c0;
    --border: rgba(128, 128, 140, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171c; --card: #23232b; --text: #f0f0f5;
      --muted: #8a8a95; --accent: #b088e6;
      --border: rgba(200, 200, 210, 0.14);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  }
  .logo {
    font-size: 42px;
    line-height: 1;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.2px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .widget-container {
    display: flex;
    justify-content: center;
    margin: 20px 0 4px;
    min-height: 44px;
  }
  .error {
    color: #c62b1f;
    font-size: 13px;
    margin-top: 16px;
  }
  .setup-note {
    margin-top: 24px;
    padding: 12px 14px;
    background: rgba(124, 64, 192, 0.08);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    text-align: left;
  }
  .setup-note strong { color: var(--text); }
  .setup-note code {
    background: rgba(128, 128, 140, 0.15);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔐</div>
  <h1>Chert Vacancy Bot</h1>
  <p class="subtitle">Вход через Telegram. Данные подписаны токеном бота и проверяются на сервере.</p>

  <div class="widget-container" id="widget"></div>

  <div class="error" id="error"></div>

  <div class="setup-note" id="setup-note" style="display:none;">
    <strong>Виджет не грузится?</strong> Проверь настройки бота у
    <a href="https://t.me/BotFather" style="color:var(--accent);">@BotFather</a>:
    <code>/setdomain</code> → выбери бота → домен без <code>https://</code>.
  </div>
</div>

<script>
'use strict';

async function init() {
  const errorEl = document.getElementById('error');
  const noteEl = document.getElementById('setup-note');
  let botUsername = '';

  try {
    const resp = await fetch('/api/config');
    const cfg = await resp.json();
    botUsername = cfg.bot_username || '';
  } catch (e) {
    errorEl.textContent = 'Не удалось получить конфиг: ' + e.message;
    return;
  }

  if (!botUsername) {
    errorEl.textContent = 'BOT_USERNAME не задан в .env на сервере.';
    return;
  }

  // Получаем ?next=... из URL, чтобы после логина вернуться туда же
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/';

  // Собираем виджет Telegram Login
  // https://core.telegram.org/widgets/login
  const script = document.createElement('script');
  script.async = true;
  script.src = 'https://telegram.org/js/telegram-widget.js?22';
  script.setAttribute('data-telegram-login', botUsername);
  script.setAttribute('data-size', 'large');
  script.setAttribute('data-radius', '10');
  script.setAttribute('data-request-access', 'write');
  script.setAttribute('data-auth-url', '/auth/callback?next=' + encodeURIComponent(next));
  document.getElementById('widget').appendChild(script);

  // Если виджет не появился за 5 секунд — показываем подсказку про /setdomain
  setTimeout(() => {
    const iframe = document.querySelector('#widget iframe');
    if (!iframe) {
      noteEl.style.display = 'block';
    }
  }, 5000);
}

init();
</script>
</body>
</html>
