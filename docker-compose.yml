services:
  vacancy-bot:
    build: .
    container_name: vacancy-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # uvicorn должен слушать все интерфейсы контейнера, наружу отдаём
      # только 127.0.0.1, реверс-прокси (Caddy) делает host сам.
      WEBAPP_HOST: 0.0.0.0
      DB_PATH: /app/data/vacancies.db
    ports:
      # Хостовый порт 8080 уже занят другим контейнером на этом VPS — используем 8081.
      # Caddy должен проксировать на 127.0.0.1:8081.
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data:/app/data
      - ../CV.md:/CV.md:ro
      - ../cover_letter_AMA.txt:/cover_letter_AMA.txt:ro
