name: CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: ruff check . --select E9,F63,F7,F82
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vacancy-bot:ci .

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          # Команда на сервере зафиксирована в authorized_keys (forced command),
          # она запускает /usr/local/sbin/vacancy-bot-deploy через sudo.
          ssh -i key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" deploy
